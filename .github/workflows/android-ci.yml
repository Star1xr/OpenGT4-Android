# OpenGT4 Android build.
#
# The job runs only where the repository variable OPENGT4_CI is set to "on".
# Mirrors without that variable skip the job and spend no Actions minutes.
name: android-ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: vars.OPENGT4_CI == 'on'
    # Pinned on purpose: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the SDK. android-actions/setup-android is
      # avoided on purpose: it installs the legacy "tools" package, which no
      # longer exists in current cmdline-tools. The SDK path is discovered
      # instead of hardcoded, so an image change cannot break the job.
      - name: Locate the Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for d in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$d" ]; then SDK="$d"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "no Android SDK found" >&2
            exit 1
          fi
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$CMDLINE" ]; then
            echo "no cmdline-tools under $SDK" >&2
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "sdk: $SDK (using $CMDLINE)"

      - name: Install SDK, NDK and CMake
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug

      # archive: false uploads the APK itself, so the artifact is the
      # installable file and not a zip around it.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          archive: false
