# OpenGT4 Android build.
#
# The job runs only where the repository variable OPENGT4_CI is set to "on".
# Mirrors without that variable skip the job and spend no Actions minutes.
name: android-ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: vars.OPENGT4_CI == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the SDK. android-actions/setup-android is
      # avoided on purpose: it installs the legacy "tools" package, which no
      # longer exists in current cmdline-tools.
      - name: Put cmdline-tools on PATH
        run: |
          CMDLINE="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$CMDLINE" ]; then
            echo "no cmdline-tools found under $ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "using $CMDLINE"

      - name: Install SDK, NDK and CMake
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opengt4-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
